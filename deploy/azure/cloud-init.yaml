#cloud-config
# First boot of the game VM (deploy/azure/setup.sh fills @REPO_URL@, @SITES@,
# @SITE_DOMAINS@, @MAP@).
# After this, the VM keeps itself current: every 5 minutes it checks GitHub and
# rebuilds only when there is a new commit (game-update.timer).
# 2 GB of swap: the B1s has under 1 GB of memory, and compiling the game
# server in the image build can run out of it.
swap:
  filename: /swapfile
  size: 2147483648
package_update: true
package_upgrade: true
packages: [docker.io, git, caddy, unattended-upgrades, openssl]

write_files:
  # Security updates install themselves; reboot at 04:00 if one needs it.
  - path: /etc/apt/apt.conf.d/52game-unattended
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
  # What this VM serves. update.sh writes the Caddy config from it on every
  # deploy: the game (gate) on SITES, the studio page (repo site/) on SITE_DOMAINS.
  # Caddy gets and renews every certificate itself.
  - path: /opt/game/config.env
    content: |
      SITES="@SITES@"
      SITE_DOMAINS="@SITE_DOMAINS@"
      MAP="@MAP@"
  # Pull the latest commit; when it changed (or the game is down, or FORCE=1),
  # hand over to the repo's own deploy step, deploy/azure/vm-update.sh, so
  # every later change to how the server runs ships through git.
  - path: /opt/game/update.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec 9>/opt/game/update.lock; flock -n 9 || exit 0
      cd /opt/game/src
      git fetch -q --depth 1 origin
      new="$(git rev-parse --short FETCH_HEAD)"
      have="$(cat /opt/game/deployed 2>/dev/null || true)"
      running="$(docker inspect -f '{{.State.Running}}' game 2>/dev/null || echo false)"
      if [ "$new" = "$have" ] && [ "$running" = true ] && [ "${FORCE:-0}" != 1 ]; then exit 0; fi
      echo "$(date -Is) deploying $new (was ${have:-none})"
      git reset -q --hard FETCH_HEAD
      NEW="$new" bash /opt/game/src/deploy/azure/vm-update.sh
      echo "$(date -Is) deployed $new"
  - path: /etc/systemd/system/game-update.service
    content: |
      [Unit]
      Description=Pull and deploy the latest game commit
      After=docker.service network-online.target
      [Service]
      Type=oneshot
      ExecStart=/opt/game/update.sh
      StandardOutput=append:/var/log/game-update.log
      StandardError=append:/var/log/game-update.log
  - path: /etc/systemd/system/game-update.timer
    content: |
      [Unit]
      Description=Check GitHub for a new game commit every 5 minutes
      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=5min
      [Install]
      WantedBy=timers.target

runcmd:
  - [sh, -c, 'umask 077 && openssl rand -hex 32 > /opt/game/gate.secret']
  - [git, clone, --depth, '1', '@REPO_URL@', /opt/game/src]
  - [systemctl, enable, --now, docker]
  - [sh, -c, '/opt/game/update.sh >> /var/log/game-update.log 2>&1']
  - [systemctl, restart, caddy]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, game-update.timer]
